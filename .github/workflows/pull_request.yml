on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - uses: actions/checkout@v6
      - uses: pvarki/config-ci-library/.github/actions/setup-python@main
        with:
          python-version: "3.11"
      - name: Do pre-commit checks (ruff, mypy, bandit)
        run: |
          uv run prek run --all-files

  bumpversion-check:
    runs-on: ubuntu-latest
    name: Validate .bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - uses: pvarki/config-ci-library/.github/actions/validate-bumpversion@main

  tests:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - uses: actions/checkout@v6
      - uses: pvarki/config-ci-library/.github/actions/setup-python@main
        with:
          python-version: "3.11"
      - name: Test with pytest
        run: |
          uv run pytest

  test-image:
    name: Run image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run image smoke test
        run: sh tests/test_image.sh

  publish:
    runs-on: ubuntu-latest
    name: Publish Docker image
    needs: [pre-commit, bumpversion-check, tests, test-image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish Docker image
        uses: pvarki/config-ci-library/.github/actions/publish-image@main
        with:
          product: releasenote
          component: tool
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-notes-preview:
    name: Preview release notes
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the notes with the image this pull request published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('.bumpversion.toml','rb'))['tool']['bumpversion']['current_version'])")
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --env GH_TOKEN \
            "ghcr.io/pvarki/releasenote-tool:${VERSION}-pr${{ github.event.number }}" \
            build --to HEAD --product releasenote-tool --release "${VERSION}" \
            --out release-notes --slides pdf --slides pptx
      - name: Put the release body on the run summary
        run: cat release-notes/release-body.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          path: release-notes
          retention-days: 7
