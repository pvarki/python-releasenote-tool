[project]
name = "releasenote-tool"
version = "0.1.0"
description = "Generate changelogs / release notes from a git tag range"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
releasenote = "releasenote_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/releasenote_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
